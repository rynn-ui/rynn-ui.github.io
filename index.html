<style>
  :root{--bg:#0d2a85;--card:#081a57;--accent:#306FFF;--ink:#ffffff;--soft:#c9d6ff}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .wrap{max-width:640px;margin:0 auto;padding:0 22px}

  .hero{text-align:center;padding:72px 0 48px}
  .hero img{width:128px;height:128px;display:block;margin:0 auto 22px}
  h1{font-size:2.6rem;letter-spacing:-.02em;line-height:1.1}
  .btn{display:inline-block;margin-top:26px;padding:14px 32px;border-radius:12px;border:0;
       background:#000;color:var(--ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--ink);color:#000}
  .btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
  .meta{margin-top:12px;color:var(--soft);font-size:.9rem;min-height:1.4em}

  h2{font-size:1.5rem;margin-bottom:14px}
  section{padding:40px 0 64px}

  details{background:var(--card);border-radius:12px;margin-bottom:18px}
  summary{padding:14px 18px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:1.3rem;line-height:1}
  details[open] summary::after{content:"\2212"}
  .drop{padding:0 18px 18px;color:var(--soft);font-size:.95rem}
  .drop input[type=file]{display:block;width:100%;margin-top:12px;padding:10px;border-radius:10px;background:var(--bg);color:var(--ink);border:2px dashed var(--accent);font:inherit}
  .drop .btn{margin-top:12px;padding:11px 24px;background:var(--accent)}
  .drop .btn:hover{background:var(--ink);color:#000}
  .drop .btn:disabled{opacity:.5;cursor:default}
  #status{margin-top:10px;min-height:1.4em}

  input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:0;background:var(--ink);color:#000;font:inherit;margin-bottom:12px}
  input[type=search]::placeholder{color:#6b7280}

  .list{display:grid;gap:10px}
  .plugin{background:var(--card);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
  .plugin .name{font-weight:600;word-break:break-word}
  .plugin .size{color:#98a8dd;font-size:.85rem}
  .plugin a{flex-shrink:0;padding:8px 16px;border-radius:10px;background:var(--accent);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
  .plugin a:hover{background:var(--ink);color:#000}
  .note{color:var(--soft)}

  footer{padding:24px 0 40px;text-align:center;color:var(--soft);font-size:.9rem}
</style>
</head>

    <h1>Keyflaw</h1>
    <a class="btn" id="apkBtn" href="#" aria-disabled="true">Download APK</a>
    <p class="meta" id="apkMeta">Checking latest version...</p>
  </div>

  <section id="plugins">
    <div class="wrap">
      <h2>Plugins</h2>

      <details>
        <summary>Upload your plugin</summary>
        <div class="drop">
          <p>Choose a .kfpack plugin file (max 5 MB). It appears in the list after review.</p>
          <input type="file" id="file" accept=".kfpack" aria-label="Plugin file">
          <button class="btn" id="send" type="button">Upload</button>
          <p id="status" aria-live="polite"></p>
        </div>
      </details>

      <input type="search" id="q" placeholder="Search plugins" aria-label="Search plugins" autocomplete="off" list="names">
      <datalist id="names"></datalist>
      <div class="list" id="list" aria-live="polite"><p class="note">Loading plugins...</p></div>
    </div>
  </section>
</main>
<footer><a id="repo" href="#">GitHub</a></footer>

<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  owner: "rynn-ui",
  repo: "rynn-ui.github.io",
  pluginsFolder: "plugins",
  branch: "main",
  uploadUrl: "https://keyflaw-upload.kagedrop.workers.dev"
};
/* ====================== */
const {owner,repo,pluginsFolder,branch,uploadUrl}=CONFIG;
const repoUrl=`https://github.com/${owner}/${repo}`, api=`https://api.github.com/repos/${owner}/${repo}`;
const $=id=>document.getElementById(id);
$("repo").href=repoUrl;
const size=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";

/* APK from latest release */
(async()=>{
  try{
    const r=await fetch(`${api}/releases/latest`); if(!r.ok)throw 0;
    const rel=await r.json();
    const apk=(rel.assets||[]).find(a=>a.name.toLowerCase().endsWith(".apk")); if(!apk)throw 0;
    $("apkBtn").href=apk.browser_download_url; $("apkBtn").removeAttribute("aria-disabled");
    $("apkMeta").textContent=`Version ${rel.tag_name}, ${size(apk.size)}`;
  }catch(e){ $("apkMeta").textContent="No release yet. Check back soon."; }
})();

/* Plugin list */
let plugins=[];
function show(list){
  const box=$("list"); box.replaceChildren();
  if(!list.length){const p=document.createElement("p");p.className="note";
    p.textContent=plugins.length?"No plugins match your search.":"No plugins yet.";box.append(p);return;}
  list.forEach(f=>{
    const row=document.createElement("div");row.className="plugin";
    const l=document.createElement("div");
    const n=document.createElement("div");n.className="name";n.textContent=f.name;
    const s=document.createElement("div");s.className="size";s.textContent=size(f.size);
    l.append(n,s);
    const a=document.createElement("a");a.href=f.download_url;a.setAttribute("download",f.name);a.textContent="Download";
    row.append(l,a);box.append(row);
  });
}
(async()=>{
  try{
    const r=await fetch(`${api}/contents/${pluginsFolder}?ref=${branch}`); if(!r.ok)throw 0;
    plugins=(await r.json()).filter(i=>i.type==="file"&&i.name.toLowerCase().endsWith(".kfpack")).sort((a,b)=>a.name.localeCompare(b.name));
    show(plugins);
    $("names").replaceChildren(...plugins.map(p=>{const o=document.createElement("option");o.value=p.name;return o;}));
  }catch(e){const p=document.createElement("p");p.className="note";p.textContent="Could not load plugins right now.";$("list").replaceChildren(p);}
})();
$("q").addEventListener("input",e=>{const t=e.target.value.trim().toLowerCase();show(plugins.filter(p=>p.name.toLowerCase().includes(t)));});

/* Upload */
$("send").addEventListener("click",async()=>{
  const st=$("status"), f=$("file").files[0];
  if(!uploadUrl){st.textContent="Uploads are not set up yet.";return;}
  if(!f){st.textContent="Choose a file first.";return;}
  if(!f.name.toLowerCase().endsWith(".kfpack")){st.textContent="Only .kfpack files are allowed.";return;}
  if(f.size>5*1024*1024){st.textContent="File is too large. Max 5 MB.";return;}
  $("send").disabled=true; st.textContent="Uploading...";
  try{
    const fd=new FormData(); fd.append("file",f);
    const r=await fetch(uploadUrl,{method:"POST",body:fd});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||"Upload failed.");
    st.textContent="Uploaded. It will appear here after review.";
    $("file").value="";
  }catch(e){st.textContent=e.message||"Upload failed. Try again.";}
  $("send").disabled=false;
});
</script>
</body>
</html>
